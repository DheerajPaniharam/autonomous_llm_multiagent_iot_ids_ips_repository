server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: ids-system-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: ids_system
          __path__: /var/log/ids/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            source_agent: source_agent
            event_type: event_type
      - labels:
          level:
          source_agent:
          event_type:
      - timestamp:
          source: timestamp
          format: RFC3339
