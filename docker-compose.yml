# IoT IDS/IPS — full stack
# Usage:
#   docker compose up -d
#   docker compose logs -f api

services:

  # -------------------------------------------------------------------------
  # PostgreSQL
  # -------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: idsuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: idsdb
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idsuser -d idsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------------
  # Grafana Loki
  # -------------------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # Promtail
  # -------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:2.9.4
    restart: unless-stopped
    volumes:
      - ./logs:/var/log/ids:ro
      - ./config/promtail-config.yaml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Grafana
  # -------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SMTP_ENABLED=${GF_SMTP_ENABLED:-true}
      - GF_SMTP_HOST=${GF_SMTP_HOST:-smtp.gmail.com:587}
      - GF_SMTP_USER=${GF_SMTP_USER}
      - GF_SMTP_PASSWORD=${GF_SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${GF_SMTP_FROM_ADDRESS:-dheerajpaniharam@gmail.com}
      - GF_SMTP_FROM_NAME=${GF_SMTP_FROM_NAME:-IoT IDS/IPS}
      - GF_SMTP_STARTTLS_POLICY=${GF_SMTP_STARTTLS_POLICY:-MandatoryStartTLS}
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/provisioning/dashboards/definitions:/etc/grafana/provisioning/dashboards/definitions:ro
      - ./config/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro

  # -------------------------------------------------------------------------
  # FastAPI Backend
  # -------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped
    
    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      db:
        condition: service_healthy
      loki:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql://idsuser:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/idsdb
      LOKI_URL: http://loki:3100
      APP_LOG_PATH: /app/logs/ids_system.log

      # Ensure Python can import the application package when running tests
      PYTHONPATH: "/app"

      # Use the in-stack Ollama service
      OLLAMA_HOST: http://ollama:11434

      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"

    volumes:
      - ./models:/app/models:ro
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./scripts:/app/scripts:ro
      - /var/log/suricata:/var/log/suricata:ro
      - /var/log/zeek:/var/log/zeek:ro
      - /run/ids:/run/ids

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # Ollama Local LLM
  # -------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./models/llm:/models:ro
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Register the checked-in GGUF into this Compose stack's Ollama volume.
  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-3b-iot-ids}
    entrypoint: ["/bin/sh", "/app/register_compose_ollama_model.sh"]
    volumes:
      - ollama_data:/root/.ollama
      - ./models/llm:/models:ro
      - ./scripts/register_compose_ollama_model.sh:/app/register_compose_ollama_model.sh:ro

  # -------------------------------------------------------------------------
  # React Dashboard
  # -------------------------------------------------------------------------
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      - api

    ports:
      - "127.0.0.1:5173:80"

# -------------------------------------------------------------------------
# Volumes
# -------------------------------------------------------------------------
volumes:
  postgres_data:
  grafana_data:
  ollama_data: